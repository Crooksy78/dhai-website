<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page Not Found | Dark Horse AI</title>
<script>
  (function () {
    var p = location.pathname;
    if (p.length > 1 && p.charAt(p.length - 1) === '/') {
      location.replace(p.replace(/\/+$/, '') + location.search + location.hash);
    }
  })();
</script>
<link rel="icon" href="/favicon.ico?v=2">
<style>
  body{font-family:-apple-system,'Segoe UI',sans-serif;background:#eef5f1;color:#122b45;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
  h1{font-size:32px;margin:0 0 12px}
  a{color:#1d5c4c;font-weight:700}
</style>
</head>
<body>
  <div>
    <h1>Page Not Found</h1>
    <p><a href="/">Go to the home page</a></p>
  </div>
</body>
</html>
